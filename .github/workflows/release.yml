name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.version.outputs.crate_name }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 target/coverage.json

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="$(jq -r '.packages[0].name' <<< "$metadata")"
          current_version="$(jq -r '.packages[0].version' <<< "$metadata")"
          if [[ -z "$crate_name" || "$crate_name" == "null" ]]; then
            echo "Could not resolve the crate name" >&2
            exit 1
          fi
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            current)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [[ "${{ inputs.bump }}" != "current" ]]; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
            tagged_version="$(
              git show "${tag}:Cargo.toml" \
                | sed -n 's/^version = "\([^"]*\)"/\1/p' \
                | head -n 1
            )"
            if [[ "$tagged_version" != "$current_version" ]]; then
              echo "Tag ${tag} does not contain version ${current_version}" >&2
              exit 1
            fi
          elif [[ "${{ inputs.bump }}" == "current" ]]; then
            echo "Tag ${tag} does not exist; choose a semantic version bump" >&2
            exit 1
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        if: ${{ inputs.bump != 'current' }}
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/(\[package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          cargo update -p "$CRATE_NAME" --precise "$NEXT_VERSION"

      - name: Commit version bump and tag
        if: ${{ inputs.bump != 'current' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

  native-bundles:
    name: CLI package (${{ matrix.id }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - id: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - id: ubuntu-24.04-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - id: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - id: macos-15-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - id: macos-15-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - id: macos-26-x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
          - id: macos-26-arm64
            os: macos-26
            target: aarch64-apple-darwin
          - id: windows-2022-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - id: windows-2025-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - id: windows-11-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify native Rust target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$actual_target" != "$EXPECTED_TARGET" ]]; then
            echo "expected ${EXPECTED_TARGET}, got ${actual_target}" >&2
            exit 1
          fi

      - name: Build the release binary
        run: cargo build --locked --release --bin portal

      - name: Verify the Unix binary runs
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/portal --version
          ./target/release/portal catalog > /dev/null

      - name: Verify the Windows binary runs
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./target/release/portal.exe --version
          ./target/release/portal.exe catalog | Out-Null

      - name: Assemble the Unix package
        if: ${{ runner.os != 'Windows' }}
        id: unix_package
        shell: bash
        env:
          BUNDLE_ID: ${{ matrix.id }}
          CRATE_NAME: ${{ needs.prepare.outputs.crate_name }}
          VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          set -euo pipefail

          binary="target/release/portal"
          if [[ ! -f "$binary" ]]; then
            echo "binary artifact is missing: ${binary}" >&2
            exit 1
          fi

          package_name="${CRATE_NAME}-${VERSION}-${BUNDLE_ID}"
          package_root="dist/${package_name}"
          mkdir -p "$package_root/skills/portal"
          install -m 755 "$binary" "$package_root/"
          install -m 644 LICENSE README.md "$package_root/"
          install -m 644 skills/portal/SKILL.md "$package_root/skills/portal/"

          binary_hash="$(shasum -a 256 "$package_root/portal" | awk '{print $1}')"
          printf '%s  portal\n' "$binary_hash" > "$package_root/SHA256SUMS"

          tar -C "$package_root" -czf "dist/${package_name}.tar.gz" .
          echo "archive=dist/${package_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Assemble the Windows package
        if: ${{ runner.os == 'Windows' }}
        id: windows_package
        shell: pwsh
        env:
          BUNDLE_ID: ${{ matrix.id }}
          CRATE_NAME: ${{ needs.prepare.outputs.crate_name }}
          VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $binary = 'target/release/portal.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "binary artifact is missing: $binary"
          }

          $packageName = "$env:CRATE_NAME-$env:VERSION-$env:BUNDLE_ID"
          $packageRoot = "dist/$packageName"
          New-Item -ItemType Directory -Force "$packageRoot/skills/portal" | Out-Null
          Copy-Item -LiteralPath $binary, 'LICENSE', 'README.md' -Destination $packageRoot
          Copy-Item -LiteralPath 'skills/portal/SKILL.md' -Destination "$packageRoot/skills/portal"

          $hash = (Get-FileHash -LiteralPath "$packageRoot/portal.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            "$packageRoot/SHA256SUMS",
            ('{0}  portal.exe' -f $hash) + [Environment]::NewLine,
            $utf8
          )

          $archive = "dist/$packageName.zip"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload the Unix package
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.crate_name }}-${{ matrix.id }}
          path: ${{ steps.unix_package.outputs.archive }}
          if-no-files-found: error

      - name: Upload the Windows package
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.crate_name }}-${{ matrix.id }}
          path: ${{ steps.windows_package.outputs.archive }}
          if-no-files-found: error

  distro-bundles:
    name: CLI package (${{ matrix.id }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fedora-43-x86_64
            os: ubuntu-24.04
            container: fedora:43
            target: x86_64-unknown-linux-gnu
            family: fedora
          - id: fedora-43-arm64
            os: ubuntu-24.04-arm
            container: fedora:43
            target: aarch64-unknown-linux-gnu
            family: fedora
          - id: fedora-44-x86_64
            os: ubuntu-24.04
            container: fedora:44
            target: x86_64-unknown-linux-gnu
            family: fedora
          - id: fedora-44-arm64
            os: ubuntu-24.04-arm
            container: fedora:44
            target: aarch64-unknown-linux-gnu
            family: fedora
          - id: archlinux-rolling-x86_64
            os: ubuntu-24.04
            container: archlinux:base-devel
            target: x86_64-unknown-linux-gnu
            family: archlinux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Fedora build tools
        if: ${{ matrix.family == 'fedora' }}
        run: dnf install -y gcc git gzip make perl tar

      - name: Install Arch Linux build tools
        if: ${{ matrix.family == 'archlinux' }}
        run: pacman -Syu --noconfirm base-devel git

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify native Rust target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$actual_target" != "$EXPECTED_TARGET" ]]; then
            echo "expected ${EXPECTED_TARGET}, got ${actual_target}" >&2
            exit 1
          fi

      - name: Build the release binary
        run: cargo build --locked --release --bin portal

      - name: Verify the binary runs
        run: |
          set -euo pipefail
          ./target/release/portal --version
          ./target/release/portal catalog > /dev/null

      - name: Assemble the distribution package
        id: package
        env:
          BUNDLE_ID: ${{ matrix.id }}
          CRATE_NAME: ${{ needs.prepare.outputs.crate_name }}
          VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          set -euo pipefail

          binary="target/release/portal"
          if [[ ! -f "$binary" ]]; then
            echo "binary artifact is missing: ${binary}" >&2
            exit 1
          fi

          package_name="${CRATE_NAME}-${VERSION}-${BUNDLE_ID}"
          package_root="dist/${package_name}"
          mkdir -p "$package_root/skills/portal"
          install -m 755 "$binary" "$package_root/"
          install -m 644 LICENSE README.md "$package_root/"
          install -m 644 skills/portal/SKILL.md "$package_root/skills/portal/"

          binary_hash="$(sha256sum "$package_root/portal" | awk '{print $1}')"
          printf '%s  portal\n' "$binary_hash" > "$package_root/SHA256SUMS"

          tar -C "$package_root" -czf "dist/${package_name}.tar.gz" .
          echo "archive=dist/${package_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload the distribution package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.crate_name }}-${{ matrix.id }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - native-bundles
      - distro-bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Create the release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.tar.gz release-assets/*.zip)
          if [[ ${#assets[@]} -ne 16 ]]; then
            echo "expected 16 platform archives, found ${#assets[@]}" >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum *.tar.gz *.zip > SHA256SUMS
          )

      - name: Create the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets are unchanged."
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Verify the published package downloads and runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          CRATE_NAME: ${{ needs.prepare.outputs.crate_name }}
          VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          set -euo pipefail
          archive="${CRATE_NAME}-${VERSION}-ubuntu-24.04-x86_64.tar.gz"
          workdir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --pattern "$archive" --pattern SHA256SUMS --dir "$workdir"

          (
            cd "$workdir"
            grep " ${archive}\$" SHA256SUMS | sha256sum --check --strict
            tar -xzf "$archive"
            ./portal --version
            ./portal catalog > /dev/null
            test -f skills/portal/SKILL.md
          )
