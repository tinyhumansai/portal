[package]
name = "portal"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "One agent-friendly door to every TinyHumans provider, search engine, and model — as a Rust SDK, CLI, MCP server, and Agent Skill."
repository = "https://github.com/tinyhumansai/portal"
documentation = "https://docs.rs/portal"
readme = "README.md"
keywords = ["agent", "mcp", "llm", "search", "sdk"]
categories = ["api-bindings", "command-line-utilities"]
publish = false
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[lib]
name = "portal"
path = "src/lib.rs"

[[bin]]
# The `portal` CLI, which also hosts the MCP server (`portal mcp`).
name = "portal"
path = "src/bin/portal.rs"

[dependencies]
# The vendored TinyHumans backend client. Portal is a thin, agent-facing facade
# over it: the SDK owns transport, auth headers, the response envelope, and the
# public-route allowlist, so none of that is reimplemented here. `socket` is off
# because Portal's surface is request/response only.
tinyhumans-sdk = { path = "vendor/sdk", version = "0.1.0", default-features = false }
# The SDK's request primitive takes a `reqwest::Method` and its multipart
# uploads take a `reqwest::multipart::Form`, so those two types cross the
# boundary. No transport features are enabled here: the SDK owns the client,
# and Cargo unifies this entry with the one it already builds.
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
# Derive macros for the crate-wide error type in `src/error/mod.rs`.
thiserror = "2"
# Capability arguments, request bodies, and MCP JSON-RPC framing are all JSON.
serde_json = "1"
# Derives for the catalog's serializable views and the MCP wire types.
serde = { version = "1", features = ["derive"] }
# The CLI's argument parser. `derive` keeps the command tree next to the types
# it produces; `wrap_help` keeps `--help` readable in a narrow terminal.
clap = { version = "4", features = ["derive", "wrap_help"] }
# Async runtime for the SDK's futures, plus stdin/stdout for the MCP server.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
# Integration tests drive the async public API.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# A local HTTP mock so client, CLI, and MCP tests exercise the real transport
# without a network or a credential. The same crate the vendored SDK tests on.
wiremock = "0.6"

[features]
default = []

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
